name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Lint e testes (Python 3.12 + MySQL 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: bytestorm
          MYSQL_USER: bytestorm
          MYSQL_PASSWORD: senha-ci
          MYSQL_ROOT_PASSWORD: root-ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_ENGINE: mysql
      DB_NAME: bytestorm
      DB_USER: root
      DB_PASSWORD: root-ci
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DJANGO_SECRET_KEY: chave-somente-para-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências do sistema para o mysqlclient
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt mysqlclient

      - name: Lint (ruff)
        run: ruff check .

      - name: Verificar migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Testes automatizados com cobertura
        run: pytest --cov=loja --cov-report=term-missing

      - name: Auditoria de dependências
        run: pip-audit -r requirements.txt
